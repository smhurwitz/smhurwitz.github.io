<!DOCTYPE html>
<html>
<head>
<style>

* {
  box-sizing: border-box;
}

.column {
  float: left;
  width: 50.00%;
  padding: 6px;
}

/* Clearfix (clear floats) */
.row::after {
  content: "";
  clear: both;
  display: table;
}

#left_image{
    display: flex;
    justify-content: right;
    align-items: center;
    height: 700px;
}

#right_image{
    display: flex;
    justify-content: left;
    align-items: center;
    height: 700px;
}





</style>

</head>
<body>

<div class="row">
  <div class="column" id="left_image">
    <img src="media/personal_faded.jpg" alt="Snow" style="width:75%">
  </div>
  <div class="column" id="right_image">
    <img src="media/professional_faded.jpg" alt="Forest" style="width:75%">
  </div>
</div>

</body>
</html>
