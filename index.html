<!DOCTYPE html>
<html>
<head>
<style>

* {
  box-sizing: border-box;
}

.column {
  float: left;
  width: 50.00%;
  padding: 10px;
}

/* Clearfix (clear floats) */
.row::after {
  content: "";
  clear: both;
  display: table;
}

#images{
    text-align:center;
}

</style>

</head>
<body>

<div class="row">
  <div class="column" id="images">
    <img src="media/personal.jpg" alt="Snow" style="width:75%">
  </div>
  <div class="column">
    <img src="media/professional.jpeg" alt="Forest" style="width:75%">
  </div>
</div>

</body>
</html>
